<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yılan — KA.OS</title>
<meta name="description" content="KA.OS tarzı küçük bir yılan oyunu. Bağımlılıksız, tek JavaScript dosyası.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#f386a1;color:#111;font-family:"DM Mono",monospace;
  background-image:radial-gradient(rgba(17,17,17,.22) 1px,transparent 1.3px);background-size:9px 9px}
.win{width:min(420px,100%);background:#fff;border:3px solid #111;box-shadow:6px 6px 0 #111;border-radius:4px;overflow:hidden}
.win-t{display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;font-family:"VT323",monospace;font-size:20px;line-height:1;padding:5px 10px 4px}
.win-t i{width:12px;height:12px;border:2px solid #fff}
.win-b{padding:18px}
footer{margin-top:22px;text-align:center;font-family:"VT323",monospace;font-size:19px}
footer a{color:#111;background:#fff;border:2px solid #111;padding:0 6px;text-decoration:none}
footer a:hover{background:#ffd23f}
</style>
</head>
<body>
<main>
  <div class="win">
    <div class="win-t"><span>yilan.exe</span><i></i></div>
    <div class="win-b"><div id="oyun"></div></div>
  </div>
  <footer><a href="https://korayakdogan.me">korayakdogan.me</a> · <a href="https://github.com/Omrndr/yilan">kaynak kod</a></footer>
</main>
<script src="yilan.js"></script>
<script>
  var oyun = KAYilan.mount(document.getElementById('oyun'));
  oyun.focus();
</script>
</body>
</html>
